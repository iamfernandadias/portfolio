<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar | Fernanda Dias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f2;--bg2:#eeebe8;--ink:#231f20;--soft:#5c5556;--muted:#6b6465;--rosa:#cb6694;--rosa-esc:#a8477a;--rosa-claro:#f8e8f0;--lima:#ebf094;--linha:rgba(35,31,32,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;min-height:100vh;display:grid;place-items:center;padding:20px}
.cartao{width:100%;max-width:380px;background:#fff;border-radius:24px;box-shadow:0 10px 30px rgba(35,31,32,.08);padding:32px 28px}
.marca{font-weight:800;font-size:15px;letter-spacing:-.02em;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
input{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--linha);border-radius:12px;background:var(--bg);color:var(--ink);margin-bottom:14px}
input:focus{outline:2px solid var(--rosa-esc);outline-offset:1px;background:#fff}
button{font:inherit;cursor:pointer}
.entrar{width:100%;background:var(--ink);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:800;margin-top:2px;transition:background .2s}
.entrar:hover{background:var(--rosa-esc)}
.entrar:disabled{opacity:.6;cursor:wait}
.link{background:none;border:0;color:var(--rosa-esc);font-weight:700;font-size:12.5px;margin-top:14px;display:block;text-align:center;width:100%;padding:4px}
.link:hover{text-decoration:underline}
.faixa{border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:16px}
.faixa.erro{background:#fbe4e4;color:#9b1c1c}
.faixa.ok{background:var(--lima);color:var(--ink)}
[hidden]{display:none!important}
</style>
</head>
<body>

<main class="cartao">
  <p class="marca">Fernanda Dias</p>
  <p class="sub" id="sub">Entre para abrir o seu painel.</p>

  <div class="faixa" id="faixa" role="alert" hidden></div>

  <form id="formEntrar" novalidate>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <button class="entrar" type="submit" id="btnEntrar">Entrar</button>
    <button class="link" type="button" id="esqueci">Esqueci minha senha</button>
  </form>

  <form id="formNova" novalidate hidden>
    <label for="nova">Nova senha</label>
    <input id="nova" type="password" autocomplete="new-password" minlength="8" required>
    <label for="nova2">Repita a nova senha</label>
    <input id="nova2" type="password" autocomplete="new-password" minlength="8" required>
    <button class="entrar" type="submit" id="btnNova">Salvar nova senha</button>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/banco.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var sb = window.sb;
  var faixa = $("#faixa");

  function aviso(texto, tipo) {
    faixa.textContent = texto;
    faixa.className = "faixa " + (tipo || "erro");
    faixa.hidden = false;
  }
  function limpar() { faixa.hidden = true; }

  if (!sb) { aviso("Não consegui carregar o sistema de login. Confira a internet e recarregue a página.", "erro"); return; }

  /* Chegou pelo link do e-mail de recuperação? Então mostramos a tela de nova senha. */
  var veioDeRecuperacao = /type=recovery/.test(location.hash) || /[?&]code=/.test(location.search);

  function mostrarNovaSenha() {
    $("#formEntrar").hidden = true;
    $("#formNova").hidden = false;
    $("#sub").textContent = "Escolha uma nova senha.";
    limpar();
  }

  sb.auth.onAuthStateChange(function (evento) {
    if (evento === "PASSWORD_RECOVERY") mostrarNovaSenha();
  });

  /* Se já tem sessão aberta, vai direto para o admin. */
  sb.auth.getSession().then(function (r) {
    var sessao = r && r.data && r.data.session;
    if (sessao && !veioDeRecuperacao) location.replace("../admin/");
  }).catch(function () {});

  $("#formEntrar").addEventListener("submit", function (e) {
    e.preventDefault();
    limpar();
    var email = $("#email").value.trim();
    var senha = $("#senha").value;
    if (!email || !senha) { aviso("Preencha o e-mail e a senha.", "erro"); return; }
    var btn = $("#btnEntrar");
    btn.disabled = true; btn.textContent = "Entrando...";
    sb.auth.signInWithPassword({ email: email, password: senha }).then(function (r) {
      if (r.error) {
        var msg = String(r.error.message || "");
        if (/fetch|network|failed/i.test(msg)) aviso("Não consegui conectar. Confira a internet e tente de novo.", "erro");
        else aviso("E-mail ou senha incorretos", "erro");
        btn.disabled = false; btn.textContent = "Entrar";
        return;
      }
      location.replace("../admin/");
    }).catch(function () {
      aviso("Não consegui conectar. Confira a internet e tente de novo.", "erro");
      btn.disabled = false; btn.textContent = "Entrar";
    });
  });

  $("#esqueci").addEventListener("click", function () {
    limpar();
    var email = $("#email").value.trim();
    if (!email) { aviso("Escreva o seu e-mail no campo acima e clique de novo em esqueci minha senha.", "erro"); $("#email").focus(); return; }
    var volta = location.origin + location.pathname;
    sb.auth.resetPasswordForEmail(email, { redirectTo: volta }).then(function (r) {
      if (r.error) aviso("Não consegui enviar agora. Tente de novo em alguns minutos.", "erro");
      else aviso("Pronto! Se esse e-mail estiver cadastrado, o link para criar uma nova senha chega em instantes. Olhe também o spam.", "ok");
    }).catch(function () { aviso("Não consegui enviar agora. Confira a internet.", "erro"); });
  });

  $("#formNova").addEventListener("submit", function (e) {
    e.preventDefault();
    limpar();
    var a = $("#nova").value, b = $("#nova2").value;
    if (a.length < 8) { aviso("A senha precisa ter pelo menos 8 caracteres.", "erro"); return; }
    if (a !== b) { aviso("As duas senhas não são iguais.", "erro"); return; }
    sb.auth.updateUser({ password: a }).then(function (r) {
      if (r.error) { aviso("Não consegui salvar a nova senha. Peça um novo link em esqueci minha senha.", "erro"); return; }
      aviso("Senha alterada! Abrindo o painel...", "ok");
      setTimeout(function () { location.replace("../admin/"); }, 900);
    }).catch(function () { aviso("Não consegui salvar. Confira a internet.", "erro"); });
  });
})();
</script>
</body>
</html>
